[workspace]
resolver = "3"
members = ["crates/kibotos-core", "crates/kibotos-app"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
authors = ["byarcy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Development builds: our crates keep line numbers (for backtraces), the
# dependencies and build scripts (including the C/C++ code of unRAR, zstd
# and bzip2) keep no debug info. This about halves target\debug and
# speeds up compiling; release builds are not affected.
[profile.dev]
debug = "line-tables-only"

# Benchmarks and tests of the core should run with optimized dependencies.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
debug = false
