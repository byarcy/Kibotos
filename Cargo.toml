[workspace]
resolver = "3"
members = ["crates/kibotos-core", "crates/kibotos-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
authors = ["byarcy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Benchmarks and tests of the core should run with optimized dependencies.
[profile.dev.package."*"]
opt-level = 2
